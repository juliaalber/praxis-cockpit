<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Praxis Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5F6B4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Praxis Cockpit">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F4EFE7; --surface:#FBF8F2; --surface2:#EDE6DA;
    --ink:#2B2723; --ink-soft:#6F675C; --line:#E0D8CA;
    --accent:#5F6B4C; --accent-ink:#F4EFE7;
    --gruen:#5E8A5A; --gelb:#C9A23F; --rot:#B5613E; --grau:#B8AFA3; --blau:#4E6D82;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0;}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:10px;font-size:15px;padding:10px 16px;transition:filter .15s,background .15s;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface2);}
  .btn-danger{background:transparent;color:var(--rot);border:1px solid var(--rot);}
  .btn-danger:hover{background:var(--rot);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:13.5px;}
  input,textarea,select{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  textarea{resize:vertical;min-height:52px;line-height:1.5;}
  label{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:0 0 5px 2px;}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 90px;}
  .hidden{display:none !important;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grow{flex:1;}

  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lockcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px 30px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(43,39,35,.08);}
  .lockcard h1{font-size:26px;margin-bottom:6px;}
  .lockcard p{color:var(--ink-soft);font-size:14.5px;margin:0 0 20px;}
  .lockcard .field{margin-bottom:14px;}
  .lockcard button{width:100%;margin-top:4px;}
  .linklike{background:none;border:none;color:var(--accent);font-size:14px;padding:10px 0 0;width:auto;text-decoration:underline;}
  .err{color:var(--rot);font-size:14px;margin:10px 0 0;min-height:18px;}
  .mark{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .mark span{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--accent-ink);}
  .code-box{background:var(--surface2);border:1px dashed var(--accent);border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:17px;letter-spacing:1px;text-align:center;margin:6px 0 4px;word-break:break-all;}

  header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .topinner{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;}
  .brand .dot span{width:9px;height:9px;border-radius:50%;border:2px solid var(--accent-ink);}
  .brand b{font-family:var(--serif);font-size:18px;font-weight:600;}
  .topbtns{display:flex;gap:8px;flex-wrap:wrap;}

  .banner{background:#F6E9E1;border:1px solid #E4C3B2;color:#7A3E27;border-radius:12px;padding:12px 16px;margin:20px 0 0;font-size:14.5px;}
  .banner b{font-weight:600;}
  .banner.soft{background:#EEF0E6;border-color:#CBD3B6;color:#4C5636;}
  .banner.info{background:#E7EDF1;border-color:#B9CBD6;color:#3B5567;}
  .banner.clickable{cursor:pointer;transition:filter .15s;}
  .banner.clickable:hover{filter:brightness(.97);}
  .bnbtn{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:3px 10px;font-size:12.5px;margin-left:8px;cursor:pointer;color:inherit;}
  .bnbtn.x{padding:3px 8px;}
  .searchx{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:15px;color:var(--ink-soft);cursor:pointer;padding:4px 6px;border-radius:6px;}
  .searchx:hover{background:rgba(0,0,0,.06);color:var(--ink);}
  .tamic{position:relative;}
  .tamic textarea{width:100%;padding-right:42px;box-sizing:border-box;}
  .micbtn{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:15px;cursor:pointer;line-height:1;}
  .micbtn:hover{background:var(--paper);}
  .micbtn.rec{background:#E8574B;border-color:#E8574B;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .heutebtn{margin-top:6px;background:var(--accent-soft,#EAE7DC);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .heutebtn:hover{background:var(--paper);}

  .controls{display:flex;gap:10px;align-items:center;margin:20px 0 8px;flex-wrap:wrap;}
  .controls .search{flex:1;min-width:180px;position:relative;}
  .controls .search input{padding-left:34px;}
  .controls .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-soft);fill:none;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap;}
  .seg button{background:transparent;border-radius:0;color:var(--ink-soft);padding:9px 12px;font-size:13.5px;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);}

  .list{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s,transform .05s;}
  .card:hover{border-color:var(--accent);} .card:active{transform:translateY(1px);}
  .amp{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .amp.gruen{background:var(--gruen);} .amp.gelb{background:var(--gelb);}
  .amp.rot{background:var(--rot);} .amp.grau{background:var(--grau);} .amp.blau{background:var(--blau);}
  .amp.lila{background:#9B8AA8;}
  .nm{font-family:var(--serif);font-size:19px;font-weight:600;min-width:140px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
  .cmid{flex:1;min-width:0;}
  .cmid .anl{font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
  .bar{height:7px;background:var(--surface2);border-radius:20px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:20px;}
  .cprog{font-size:12.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:.3px;}
  .cright{text-align:right;flex-shrink:0;min-width:98px;}
  .cright .d{font-size:14px;} .cright .ago{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;font-weight:600;}
  .badge.foto{background:#F1E4D5;color:#8A5A2B;}
  .badge.aktiv{background:#E4EFE0;color:#3F6B3A;} .badge.pausiert{background:#F3ECD8;color:#8A6B22;}
  .badge.beendet{background:#E6E2DA;color:#6F675C;} .badge.nachfragen{background:#E7EDF1;color:#3B5567;}
  .badge.unsicher{background:#EDE7F1;color:#6B5A7A;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;}
  .empty h2{font-size:22px;margin-bottom:8px;color:var(--ink);}

  .back{background:none;border:none;color:var(--ink-soft);padding:6px 0;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin:20px 0 6px;}
  .dhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:2px;flex-wrap:wrap;}
  .dhead h1{font-size:30px;}
  .dhead .amp{width:14px;height:14px;margin-top:12px;}
  .dsub{color:var(--ink-soft);font-size:14.5px;margin-top:4px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden;}
  .phead{display:flex;align-items:center;gap:10px;padding:16px 20px;cursor:pointer;user-select:none;}
  .phead:hover{background:var(--surface2);}
  .phead h3{font-size:16px;} .phead .cnt{font-size:13px;color:var(--ink-soft);}
  .phead .chev{margin-left:auto;transition:transform .2s;color:var(--ink-soft);}
  .phead .chev.open{transform:rotate(180deg);}
  .pbody{padding:0 20px 20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;} .field:last-child{margin-bottom:0;}
  .prog-detail{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .prog-detail .bar{flex:1;}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;margin:0;}
  .check input{width:auto;}
  .checkgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;margin-top:6px;}
  .hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 12px;font-style:italic;}
  mark{background:#F3E7C4;color:var(--ink);padding:0 2px;border-radius:3px;}

  .brline{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .brline textarea{min-height:40px;}
  .brline button{flex-shrink:0;}

  /* Bodyreading-Tabelle */
  .brtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;}
  table.brt{border-collapse:collapse;width:100%;min-width:640px;}
  table.brt th,table.brt td{border:1px solid var(--line);padding:0;vertical-align:top;}
  table.brt thead th{background:var(--surface2);font-family:var(--serif);font-weight:600;font-size:13.5px;padding:8px 10px;text-align:center;white-space:nowrap;position:sticky;top:0;}
  table.brt th.rowlab{background:var(--surface2);text-align:left;min-width:96px;position:sticky;left:0;z-index:2;}
  table.brt td{background:var(--surface);}
  table.brt td textarea{border:none;border-radius:0;background:transparent;min-height:44px;font-size:13.5px;padding:6px 8px;}
  table.brt td textarea:focus{background:#fff;outline:1px solid var(--accent);}
  table.brt th.rowlab input{border:none;background:transparent;font-family:var(--serif);font-weight:600;padding:6px 8px;}
  .rowdel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0 6px;}
  .coldel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 4px;}
  .brtoolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  /* Vollbild-Ansicht */
  .overlay.brfull{padding:0;}
  .brmodal{background:var(--surface);border-radius:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;padding:0;display:flex;flex-direction:column;overflow:hidden;}
  .brmodal-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brmodal-head h2{font-size:20px;margin:0;}
  .brmodal-body{flex:1;overflow:auto;padding:16px 22px 40px;}
  table.brt.big{min-width:100%;}
  table.brt.big thead th{font-size:15px;padding:12px 12px;min-width:150px;}
  table.brt.big th.rowlab{min-width:120px;font-size:15px;}
  table.brt.big td textarea{min-height:88px;font-size:15px;padding:10px 12px;}
  table.brt.big th.rowlab input{font-size:15px;}

  .sess{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:var(--surface);}
  .sesshead{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:var(--surface2);}
  .sesshead b{font-family:var(--serif);font-size:16px;}
  .sesshead .snum{font-size:12px;color:var(--accent);font-weight:600;}
  .sesshead .sd{color:var(--ink-soft);font-size:13.5px;}
  .sessbody{padding:16px;border-top:1px solid var(--line);}
  .chev{transition:transform .2s;color:var(--ink-soft);}
  .chev.open{transform:rotate(180deg);}
  .qbox{background:var(--surface2);border-radius:10px;padding:14px;margin:6px 0 12px;}
  .qbox .qh{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:10px;}
  .qitem{margin-bottom:10px;} .qitem:last-child{margin-bottom:0;}
  .qitem .ql{font-size:14px;font-weight:600;margin-bottom:4px;}
  .rowbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .oneinch{background:#EFEADA;border:1px solid #D8C89A;border-radius:10px;padding:12px 14px;font-size:14px;color:#6B5A28;margin:2px 0 14px;}

  .foto-slot{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center;}
  .foto-slot .lab{font-weight:600;min-width:150px;}
  .foto-slot.due{border-color:var(--rot);background:#F9ECE5;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--surface2);}

  .thread{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  .thread:last-child{border:none;}
  .thread .tn{font-weight:600;min-width:150px;}
  .thread .tb{flex:1;height:8px;background:var(--surface2);border-radius:20px;overflow:hidden;}
  .thread .tb i{display:block;height:100%;background:var(--accent);}
  .thread .tc{font-size:13px;color:var(--ink-soft);min-width:80px;text-align:right;}

  .ncitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .ncitem:last-child{border:none;} .ncitem.done .nct{text-decoration:line-through;color:var(--ink-soft);}
  .ncitem input[type=checkbox]{width:auto;} .nct{flex:1;}

  .setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .setrow:last-child{border:none;} .setrow .txt{flex:1;}
  .setrow .txt b{font-weight:600;} .setrow .txt p{margin:2px 0 0;font-size:13.5px;color:var(--ink-soft);}
  .status{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--ink-soft);}
  .status.ok{background:#E4EFE0;color:#3F6B3A;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:20px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(20px);}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .stat .num{font-family:var(--serif);font-size:30px;font-weight:600;}
  .stat .cap{font-size:13px;color:var(--ink-soft);margin-top:2px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(43,39,35,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:460px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:88vh;overflow:auto;}
  .modal h2{font-size:21px;margin-bottom:6px;}
  .modal p{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  .modal .check{padding:8px 0;border-bottom:1px solid var(--line);}
  .modal .actions{display:flex;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;z-index:80;pointer-events:none;max-width:90%;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:640px){
    .grid2,.grid3,.checkgrid{grid-template-columns:1fr;}
    .nm{min-width:110px;} .cright{min-width:80px;}
    .foto-slot{flex-direction:column;align-items:flex-start;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}
  .stathead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  @media print{header.top,.back,.rowbtns,.phead .chev,.stathead button,.controls,.topbtns{display:none!important;}.panel{break-inside:avoid;}.stat{break-inside:avoid;}}
</style>
</head>
<body>

<div id="lock"><div class="lockcard" id="lockCard"></div></div>

<div id="app" class="hidden">
  <header class="top"><div class="topinner">
    <div class="brand" onclick="go('overview')"><div class="dot"><span></span></div><b>Praxis-Cockpit</b></div>
    <div class="grow"></div>
    <div class="topbtns">
      <button class="btn-ghost" onclick="sichereJetzt()" id="sichernBtn">Sichern</button>
      <button class="btn-ghost" onclick="go('archiv')">Archiv</button>
      <button class="btn-ghost" onclick="go('statistik')">Statistik</button>
      <button class="btn-ghost" onclick="go('settings')">Einstellungen</button>
      <button class="btn-primary" onclick="newClient()">Neue Klient:in</button>
    </div></div></header>
  <div class="wrap" id="view"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===== IndexedDB ===== */
const DB="praxis_cockpit_v2";
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const db=r.result;
    if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
    if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function txGet(store,k){return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(store,"readonly").objectStore(store).get(k);
  t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);}));}
function txSet(store,k,v){return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(store,"readwrite").objectStore(store).put(v,k);
  t.onsuccess=()=>res();t.onerror=()=>rej(t.error);}));}

/* ===== Krypto ===== */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbkdf2Key(pw,salt){const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["wrapKey","unwrapKey"]);}
async function newMasterKey(){return crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);}
async function wrapMK(mk,wk){const iv=crypto.getRandomValues(new Uint8Array(12));const w=await crypto.subtle.wrapKey("raw",mk,wk,{name:"AES-GCM",iv});return{iv:b64(iv),w:b64(w)};}
async function unwrapMK(rec,wk){return crypto.subtle.unwrapKey("raw",unb64(rec.w),wk,{name:"AES-GCM",iv:unb64(rec.iv)},{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);}
async function encWithMK(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},MK,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)};}
async function decWithMK(rec){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv)},MK,unb64(rec.ct));return JSON.parse(dec.decode(pt));}
async function encBlob(blob){const buf=await blob.arrayBuffer();const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},MK,buf);return{iv:b64(iv),ct:b64(ct),type:blob.type||"application/octet-stream"};}
async function decBlob(rec){const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv)},MK,unb64(rec.ct));return new Blob([buf],{type:rec.type});}
async function rawMK(){return b64(await crypto.subtle.exportKey("raw",MK));}
async function importRawMK(s){return crypto.subtle.importKey("raw",unb64(s),{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);}

async function doSetup(){const p1=$("#sp1").value,p2=$("#sp2").value,err=$("#setupErr");err.textContent="";
  const withPw=p1.length>0;
  if(withPw){if(p1.length<4){err.textContent="Mindestens 4 Zeichen.";return;}if(p1!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}}
  MK=await newMasterKey();const recovery=genRecovery();const recSalt=crypto.getRandomValues(new Uint8Array(16));
  const wrapRec=await wrapMK(MK,await pbkdf2Key(recovery,recSalt));
  const cfg={passwortAktiv:withPw,recSalt:b64(recSalt),wrapRec};
  if(withPw){const s=crypto.getRandomValues(new Uint8Array(16));cfg.pwSalt=b64(s);cfg.wrapPw=await wrapMK(MK,await pbkdf2Key(p1,s));}
  else{cfg.mkPlain=await rawMK();}
  await txSet("kv","config",cfg);STATE=DEFAULTS();STATE.settings.passwortAktiv=withPw;
  await txSet("kv","data",await encWithMK(STATE));showRecovery(recovery,()=>afterUnlock());}

function genRecovery(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function migrate(k){try{

  if(!k.brRows)k.brRows=BR_ROWS_DEFAULT.slice();if(!k.brCells)k.brCells={};
  k.health=k.health||{};k.health.checks=k.health.checks||{};
  k.fotos=k.fotos||[];k.nachchecken=k.nachchecken||[];k.healthFiles=k.healthFiles||[];k.sessions=k.sessions||[];k.archiv=k.archiv||[];
  k.customPanels=k.customPanels||[];
  if(!k.sprache)k.sprache="de";
  k.einwilligung=k.einwilligung||{datum:"",dateien:[]};if(!Array.isArray(k.einwilligung.dateien))k.einwilligung.dateien=[];
  // Bestehende „beendet" wandern ins Archiv (archiviert-Flag), Status bleibt erhalten
  if(k.archiviert===undefined)k.archiviert=(k.status==="beendet");
  // Momente: aus Text-Liste Objekte machen
  k.persoenliches=(k.persoenliches||[]).map(p=>typeof p==="string"?{id:uid("m"),text:p,erinnern:false}:p);
  k.sessions.forEach((s,i)=>{if(s.zwischen===undefined)s.zwischen=false;if(s.ord===undefined)s.ord=i;
    if(!s.antworten)s.antworten={};
    // Fragebogen einfrieren: bestehende Sitzung behält ihre Fragen, auch wenn Vorlage sich später ändert
    if(!s.fragen&&s.vorlageId){const v=(STATE.vorlagen||[]).find(x=>x.id===s.vorlageId);
      if(v&&Array.isArray(v.fragen)){s.fragen=v.fragen.slice();s.vorlageTitel=v.titel;}}
    if(!s.fragen&&s.antworten&&Object.keys(s.antworten).length){s.fragen=Object.keys(s.antworten);s.vorlageTitel=s.vorlageTitel||"Fragebogen";}});
}catch(e){console.warn("migrate übersprungen für",k&&k.id,e);}}
function migrateSettings(){const st=STATE.settings;
  if(st.zeigeVonX===undefined)st.zeigeVonX=false;
  if(!st.globalPanels)st.globalPanels=[];
  if(!st.panelOrder||!st.panelOrder.length)st.panelOrder=CORE_PANELS.map(p=>p.key);
  // Fehlende Core-Panels an ihrer richtigen Position einfügen (nicht vorne)
  CORE_PANELS.forEach((p,idx)=>{if(!st.panelOrder.includes(p.key)){
    // vorheriges Core-Panel in der Ordnung suchen und dahinter einfügen
    let pos=st.panelOrder.length;
    for(let j=idx-1;j>=0;j--){const vor=st.panelOrder.indexOf(CORE_PANELS[j].key);if(vor>=0){pos=vor+1;break;}}
    st.panelOrder.splice(pos,0,p.key);}});
  if(!st.bausteine)st.bausteine=defaultBausteine();
  if(!st.prompts||!st.prompts.length)st.prompts=defaultPrompts();
  if(!st.praxis)st.praxis={name:"",inhaberin:"Julia Alber",adresse:"",telefon:"",email:"",web:"",fuss:"",logoFid:"",farbe:"#5F6B4C"};
  if(!st.willkommen)st.willkommen={text:"",fid:"",name:""};
  if(!st.dismiss)st.dismiss={};
  if(!st.honorare)st.honorare=[];
  if(!st.suchgruppen)st.suchgruppen=defaultSuchgruppen();
  if(!st.settingsOrder)st.settingsOrder=defaultSettingsOrder();
  if(st.lastBackupAt===undefined)st.lastBackupAt="";
  if(st.archivReviewAt===undefined)st.archivReviewAt="";

/* Schreibt pro Person Einzeldokumente (md + doc) + Fotos + Health-Form-Dateien */
async function doWrite(withFiles,interactive){if(bkBusy)return false;
  const erlaubt=await ensurePerm(interactive);
  if(!erlaubt){if(!interactive)backupBraucht=true;return false;}
  bkBusy=true;
  try{
    const alle=STATE.klienten;
    for(const k of alle){const dir=await subDir(backupDir,safe(k.name||"Klient"));
      const teile={
        "00_Gesamtakte":clientMarkdown(k,null),
        "01_Stammdaten":mdStamm(k),
        "02_Health_Form":mdHealth(k),
        "03_Bodyreading":mdBody(k),
        "04_Momente":mdMomente(k),
        "05_Nachchecken":mdNachchecken(k)};
      for(const [name,md] of Object.entries(teile)){
        await writeFile(dir,name+".md",md);
        await writeFile(dir,name+".doc",wordDocPlain(name.replace(/^\d+_/,""),mdToHtml(md)));}
      // Sitzungen einzeln
      const sdir=await subDir(dir,"Sitzungen");const ss=orderedSessions(k);
      // vorhandene Sitzungsdateien grob aktuell halten: einfach neu schreiben
      for(const s of ss){const base=(s.zwischen?"Z":"")+(s._nr||"x")+"_"+safe(s.titel||"Sitzung");
        const md=mdSession(k,s);
        await writeFile(sdir,base+".md",md);
        await writeFile(sdir,base+".doc",wordDocPlain(sessionLabel(k,s),mdToHtml(md)));}
      if(withFiles){
        // Fotos
        if((k.fotos||[]).length){const fdir=await subDir(dir,"fotos");
          for(const f of k.fotos){try{const blob=await getFileBlob(f.fid);if(blob){const m=MILESTONES.find(x=>x.key===f.key);
            await writeFile(fdir,(m?safe(m.label):"Foto")+"_"+safe(f.name||f.id)+extOf(f.name),blob);}}catch(e){}}}

function daysSince(d){if(!d)return null;return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function agoHuman(d){const dv=daysSince(d);if(dv===null)return"noch nie";if(dv===0)return"heute";if(dv===1)return"gestern";
  if(dv<14)return "vor "+dv+" Tagen";if(dv<60)return "vor "+Math.round(dv/7)+" Wochen";return "vor "+Math.round(dv/30)+" Monaten";}
function ampel(k){if(k.status==="pausiert")return"blau";if(k.status==="unsicher")return"lila";if(k.status==="nachfragen")return"gelb";
  // Ruhephase: bis zum selbst gesetzten Datum bleibt es grün
  if(k.ruheBis){const heute=today();if(heute<k.ruheBis)return"gruen";}

function geburtstagTage(k){if(!k.geburtsdatum)return null;
  const raw=k.geburtsdatum.trim();
  let tag,monat,jahr;
  const iso=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(iso){jahr=+iso[1];monat=+iso[2];tag=+iso[3];}
  else{const de=raw.match(/^(\d{1,2})[.\-\/](\d{1,2})(?:[.\-\/](\d{2,4}))?/);
    if(!de)return null;tag=+de[1];monat=+de[2];jahr=de[3]?(+de[3]<100?1900+ +de[3]:+de[3]):null;}
  if(!tag||!monat||monat>12||tag>31)return null;
  const now=new Date();const heuteJahr=now.getFullYear();
  const heute0=new Date(heuteJahr,now.getMonth(),now.getDate());
  let next=new Date(heuteJahr,monat-1,tag);
  if(next<heute0)next=new Date(heuteJahr+1,monat-1,tag);
  const tageBis=Math.round((next-heute0)/86400000);
  const wird=jahr?next.getFullYear()-jahr:null;
  return {tageBis,datum:next,wird,tag,monat};}

/* Gesundheits-Hinweise beim Öffnen: Krankheiten + Anderes, je einzeln wegklickbar (getrennt vom Nachchecken) */

function renderPanels(k){const order=STATE.settings.panelOrder.slice();
  // Sicherheitsnetz: fehlende Core-Panels an richtiger Stelle ergänzen
  CORE_PANELS.forEach((p,idx)=>{if(!order.includes(p.key)){let pos=order.length;
    for(let j=idx-1;j>=0;j--){const vor=order.indexOf(CORE_PANELS[j].key);if(vor>=0){pos=vor+1;break;}}
    order.splice(pos,0,p.key);}});
  const out=[];
  order.forEach(key=>{

    if(core){out.push(corePanel(k,core.key,core.titel));return;}
    const cp=(k.customPanels||[]).find(p=>p.key===key);
    if(cp)out.push(panel(cp.key,cp.titel,"",customBody(k,cp)));});

/* ---- Suche in der Akte ---- */
function clearAkteSearch(){akteQuery="";renderDetail();}
/* Suchbegriffe = eingegebenes Wort + alle Synonyme aus passenden Gruppen */
function suchBegriffe(q){const ql=q.trim().toLowerCase();if(!ql)return [];
  const set=new Set([ql]);
  (STATE.settings.suchgruppen||[]).forEach(g=>{const woerter=(g.woerter||[]).map(w=>w.toLowerCase());
    if(woerter.some(w=>w===ql||w.includes(ql)||ql.includes(w)))woerter.forEach(w=>set.add(w));});
  return [...set].filter(Boolean);}
function trifftEinBegriff(txt,begriffe){const t=(txt||"").toLowerCase();return begriffe.some(b=>t.includes(b));}
function drawAkteHits(k){const box=$("#akteHits");if(!box)return;const q=akteQuery.trim();
  if(!q){box.innerHTML="";return;}
  const begriffe=suchBegriffe(q);
  const hits=[];
  const add=(wo,txt)=>{if(txt&&trifftEinBegriff(txt,begriffe))hits.push([wo,txt]);};
  add("Anliegen",k.anliegen);add("Motivation",k.motivation);
  (k.persoenliches||[]).forEach(p=>add("Momente",p&&p.text));
  (k.nachchecken||[]).forEach(n=>add("Nachchecken",n.text));
  Object.keys(k.brCells||{}).forEach(r=>Object.keys(k.brCells[r]).forEach(c=>add("Bodyreading "+r+" · S"+c,k.brCells[r][c])));
  orderedSessions(k).forEach(s=>{const lab=sessionLabel(k,s)+(s.titel?" ("+s.titel+")":"");
    [["Ziele/Aussagen",s.ziel],["Vorher",s.vorher],["Nachher",s.nachher],["Beobachtungen",s.beob],["Interventionen",s.interv],
     ["Reaktion",s.reaktion],["Hausaufgabe",s.hausauf],["Nächste Schritte",s.next],["Notizen",s.frei]].forEach(([f,v])=>add(lab+" · "+f,v));
    if(s.antworten)Object.keys(s.antworten).forEach(qq=>add(lab+" · "+qq,s.antworten[qq]));
    if(s.antworten2)Object.keys(s.antworten2).forEach(qq=>add(lab+" · "+qq,s.antworten2[qq]));
    if(s.nachfrage)add(lab+" · Nachfragen",s.nachfrage);});
  (k.customPanels||[]).forEach(cp=>add(cp.titel,cp.text));
  // Health Form
  if(k.health){Object.keys(k.health).forEach(f=>{if(typeof k.health[f]==="string")add("Health Form · "+f,k.health[f]);});
    Object.keys(k.health.checks||{}).forEach(c=>{if(k.health.checks[c])add("Health Form",c);});}
  const syn=begriffe.length>1?` <span style="color:var(--ink-soft)">(auch: ${begriffe.filter(b=>b!==q.toLowerCase()).join(", ")})</span>`:"";
  box.innerHTML=hits.length?`<div class="panel"><div class="pbody" style="padding-top:18px">
    <p class="hint">${hits.length} Treffer für „${escapeHtml(q)}“${syn}</p>
    ${hits.map(([wo,t])=>`<div class="field"><label>${escapeHtml(wo)}</label><div style="font-size:14.5px">${highlightMulti(t,begriffe)}</div></div>`).join("")}
    </div></div>`:`<div class="panel"><div class="pbody" style="padding-top:18px"><p style="color:var(--ink-soft);font-size:14px">Keine Treffer für „${escapeHtml(q)}“${syn}.</p></div></div>`;}
function highlightMulti(t,begriffe){let e=escapeHtml(t);
  // längste zuerst, damit Teilwörter nicht kaputt markiert werden
  [...begriffe].sort((a,b)=>b.length-a.length).forEach(b=>{if(!b)return;
    const re=new RegExp("("+b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    e=e.replace(re,'<mark>$1</mark>');});
  // doppelte Verschachtelung vermeiden
  return e.replace(/<mark><mark>/g,"<mark>").replace(/<\/mark><\/mark>/g,"</mark>");}
function highlight(t,q){const e=escapeHtml(t);const i=e.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return e;return e.slice(0,i)+"<mark>"+e.slice(i,i+q.length)+"</mark>"+e.slice(i+q.length);}

/* Alle sichtbaren Bodyreading-Felder sofort in die Daten schreiben (vor Umbau/Schließen) */
function flushBR(k){const scope=brBigOpen()||document;
  scope.querySelectorAll('[data-brc]').forEach(el=>{const r=el.dataset.brc,c=el.dataset.brcol;
    k.brCells[r]=k.brCells[r]||{};k.brCells[r][c]=el.value.trim();});
  scope.querySelectorAll('[data-brrow]').forEach(el=>{const ri=+el.dataset.brrow;const old=k.brRows[ri];const neu=el.value.trim()||old;
    if(neu!==old){if(k.brCells[old]){k.brCells[neu]=k.brCells[old];delete k.brCells[old];}k.brRows[ri]=neu;}});}
function refreshBR(){const k=K();const big=brBigOpen();if(big){big.innerHTML=brTableHtml(k,true)+brToolbarBig(k);bindBodyreading(k);}else renderDetail();}
function brToolbarBig(k){return `<div class="brtoolbar" style="margin-top:14px">

    ${brCols(k).length>brBaseCols(k)?`<button class="btn-ghost btn-sm" onclick="delBrCol()">Letzte Spalte entfernen</button>`:""}
  </div>`;}

  $("#modalRoot").innerHTML=`<div class="overlay brfull"><div class="brmodal">

      <button class="btn-primary btn-sm" onclick="closeBRBig()">Schließen</button></div>

  </div></div>`;
  bindBodyreading(k);}
function closeBRBig(){const k=K();flushBR(k);save();closeModal();renderDetail();}
function bindBodyreading(k){const scope=brBigOpen()||document;
  scope.querySelectorAll('[data-brc]').forEach(el=>el.addEventListener("input",()=>{const r=el.dataset.brc,c=el.dataset.brcol;
    k.brCells[r]=k.brCells[r]||{};k.brCells[r][c]=el.value.trim();save();}));
  scope.querySelectorAll('[data-brrow]').forEach(el=>el.addEventListener("change",()=>{const ri=+el.dataset.brrow;const old=k.brRows[ri];const neu=el.value.trim()||old;
    if(neu!==old){flushBR(k);if(k.brCells[old]){k.brCells[neu]=k.brCells[old];delete k.brCells[old];}k.brRows[ri]=neu;save();refreshBR();}}));}
function addBrRow(){const k=K();flushBR(k);k.brRows.push("Neu");save();refreshBR();}
function delBrRow(ri){const k=K();const r=k.brRows[ri];if(!confirm("Zeile „"+r+"\" löschen?"))return;
  flushBR(k);k.brRows.splice(ri,1);delete k.brCells[r];save();refreshBR();}

function delBrCol(){const k=K();const cols=brCols(k);if(cols.length<=brBaseCols(k)){toast("Diese Spalten gehören zu Sitzungen und bleiben.");return;}
  flushBR(k);const last=cols.length;k.brRows.forEach(r=>{if(k.brCells[r])delete k.brCells[r][last];});
  k.brColCount=cols.length-1;save();refreshBR();}

/* ===== Diktieren (Sprache zu Text) ===== */
let dikt=null;
function diktLang(){const k=(route&&route.name==="detail")?K():null;const s=k&&k.sprache;return s==="en"?"en-US":s==="it"?"it-IT":"de-DE";}
function toggleDikt(btn){
  const ta=btn.previousElementSibling;if(!ta||(ta.tagName!=="TEXTAREA"&&ta.tagName!=="INPUT"))return;
  if(dikt){try{dikt.stop();}catch(e){}return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Diktieren braucht Chrome oder Edge.");return;}
  dikt=new SR();dikt.lang=diktLang();dikt.interimResults=true;dikt.continuous=true;
  let base=ta.value;btn.classList.add("rec");
  dikt.onresult=e=>{let fin="",int="";
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else int+=r[0].transcript;}
    if(fin)base=(base?base.replace(/\s*$/,"")+" ":"")+fin.trim();
    ta.value=(base+(int?" "+int:"")).replace(/^\s+/,"");};
  dikt.onerror=()=>{btn.classList.remove("rec");dikt=null;};
  dikt.onend=()=>{btn.classList.remove("rec");ta.value=base.trim();ta.dispatchEvent(new Event("change",{bubbles:true}));dikt=null;};
  try{dikt.start();toast("Sprich jetzt — Knopf nochmal drücken beendet.");}catch(e){btn.classList.remove("rec");dikt=null;}}
/* Textarea mit Mikrofon-Knopf */
function taMic(attrs,value){return `<div class="tamic"><textarea ${attrs}>${escapeHtml(value||"")}</textarea>
  <button type="button" class="micbtn" onclick="toggleDikt(this)" title="Diktieren">🎤</button></div>`;}
function matchVorlage(titel){const t=(titel||"").toLowerCase();
  // #1, #2 … hat Vorrang: sucht die Vorlage mit dieser Sitzungsnummer
  const raute=t.match(/#\s*(\d{1,2})/);
  if(raute){const n=parseInt(raute[1]);const v=STATE.vorlagen.find(x=>x.nr===n);if(v)return v;}
  let m=STATE.vorlagen.find(v=>!v.standard&&t.includes(v.titel.toLowerCase().split(/[ (]/)[0]));
  if(!m)m=STATE.vorlagen.find(v=>!v.standard&&v.titel.toLowerCase().split(/[ (]/).some(w=>w.length>3&&t.includes(w)));
  return m||STATE.vorlagen.find(v=>v.standard)||STATE.vorlagen[0];}
/* Fragebogen einer Sitzung als eingefrorene Kopie (Vorlagen-Änderungen wirken NICHT rückwirkend) */
function ensureFragebogen(k,s,slot){ // slot: 1 oder 2
  const idKey=slot===2?"vorlage2Id":"vorlageId";
  const snapKey=slot===2?"fragen2":"fragen";
  const titelKey=slot===2?"vorlage2Titel":"vorlageTitel";
  if(!s[idKey]&&slot===1)s[idKey]=matchVorlage(s.titel).id; // erster Fragebogen: automatisch
  if(!s[idKey])return null; // zweiter ist optional
  if(!s[snapKey]){const v=STATE.vorlagen.find(x=>x.id===s[idKey]);if(v){s[snapKey]=(Array.isArray(v.fragen)?v.fragen:[]).slice();s[titelKey]=v.titel;}}
  return s[snapKey]?{fragen:s[snapKey],titel:s[titelKey]||""}:null;}
function fragebogenBlock(k,s,slot){const fb=ensureFragebogen(k,s,slot);
  const idKey=slot===2?"vorlage2Id":"vorlageId";const curId=s[idKey]||"";
  const auswahl=`<div class="field"><label>${slot===2?"Zweiter Fragebogen (optional)":"Fragebogen"}</label>
    <select data-s="${s.id}" data-fbslot="${slot}">
      ${slot===2?`<option value="">— kein zweiter —</option>`:""}
      ${STATE.vorlagen.map(v=>`<option value="${v.id}"${v.id===curId?" selected":""}>${escapeHtml(v.titel)}</option>`).join("")}</select></div>`;
  const answerKey=slot===2?"antworten2":"antworten";
  const box=fb?`<div class="qbox"><div class="qh">${escapeHtml(fb.titel)}</div>
    ${fb.fragen.map((q,qi)=>`<div class="qitem"><div class="ql">${escapeHtml(q)}</div>
      <textarea data-s="${s.id}" data-qa="${slot}" data-qi="${qi}">${escapeHtml((s[answerKey]&&s[answerKey][q])||"")}</textarea></div>`).join("")}</div>`:"";
  return auswahl+box;}
function sessionsBody(k){k.sessions=k.sessions||[];const ss=orderedSessions(k).slice().reverse();
  return `<div>${ss.map(s=>sessionHtml(k,s)).join("")||'<p style="color:var(--ink-soft);font-size:14px">Noch keine Sitzung erfasst.</p>'}</div>
    <div class="rowbtns"><button class="btn-primary" onclick="addSession()">Sitzung hinzufügen</button>
    ${ss.length>1?`<button class="btn-ghost btn-sm" onclick="resortByDate()">Wieder nach Datum sortieren</button>`:""}</div>`;}
/* Ist bei dieser Sitzung ein Foto-Meilenstein fällig? (nach Sitzungsnummer) */
function fotoFuerSitzung(k,s){if(k.fotosAus||s.zwischen||!s._nr)return null;
  const have=new Set((k.fotos||[]).map(f=>f.key));
  return MILESTONES.find(m=>{const n=m.key==="vor1"?1:parseInt(m.label.replace(/\D/g,""));return n===s._nr&&!have.has(m.key);});}
function sessionHtml(k,s){const open=s._open;const tot=serieTotal(k);
  const isLast=tot&&!s.zwischen&&s._nr===tot;

  const body=open?`<div class="sessbody">

    ${fotoM?`<div class="banner soft" style="margin:0 0 12px"><b>📷 Heute Foto:</b> ${fotoM.label}. Im Bereich „Fotos" hinzufügen.</div>`:""}
    <div class="grid2">

    <div class="rowbtns"><button class="btn-danger btn-sm" onclick="delSession('${s.id}')">Sitzung löschen</button></div>
  </div>`:"";
  return `<div class="sess"><div class="sesshead">

      <span class="snum">${escapeHtml(sessionLabel(k,s))}</span><b>${escapeHtml(s.titel||"Ohne Titel")}</b>
      <span class="sd">${s.datum?fmt(s.datum):"ohne Datum"}</span>${fotoM?'<span class="badge foto">Foto</span>':''}
      <svg class="chev ${open?'open':''}" style="margin-left:auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>

/* Titel geändert → passende Vorlage automatisch übernehmen.
   Nur solange nichts ausgefüllt ist und du nicht selbst eine Vorlage gewählt hast. */
function autoVorlage(k,s){if(s.vorlageManuell)return false;
  const v=matchVorlage(s.titel);if(!v||s.vorlageId===v.id)return false;
  const hatAntworten=s.antworten&&Object.keys(s.antworten).some(q=>(s.antworten[q]||"").trim());
  if(hatAntworten)return false; // nichts überschreiben, was schon Text enthält
  s.vorlageId=v.id;delete s.fragen;delete s.vorlageTitel;return true;}
function bindSessions(k){document.querySelectorAll('[data-k]').forEach(el=>{if(!el.dataset.s)return;
    el.addEventListener("change",()=>{const s=k.sessions.find(x=>x.id===el.dataset.s);if(!s)return;
      s[el.dataset.k]=el.value.trim?el.value.trim():el.value;
      if(el.dataset.k==="datum"&&s.datum)s.datumOffen=false; // Datum eingetragen → offen-Flag weg
      if(el.dataset.k==="titel")autoVorlage(k,s);
      if(el.dataset.ziel)syncNachchecken(k,s);
      save();
      if(el.dataset.k==="titel"||el.dataset.k==="datum"||el.dataset.ziel)renderDetail();});});
  document.querySelectorAll('[data-datumoffen]').forEach(el=>el.addEventListener("change",()=>{const s=k.sessions.find(x=>x.id===el.dataset.datumoffen);if(!s)return;
    s.datumOffen=el.checked;if(el.checked)s.datum="";save();renderDetail();}));
  // Fragebogen-Auswahl (Slot 1/2): Snapshot neu setzen
  document.querySelectorAll('[data-fbslot]').forEach(el=>el.addEventListener("change",()=>{const s=k.sessions.find(x=>x.id===el.dataset.s);if(!s)return;
    const slot=+el.dataset.fbslot;const idKey=slot===2?"vorlage2Id":"vorlageId";const snapKey=slot===2?"fragen2":"fragen";const titelKey=slot===2?"vorlage2Titel":"vorlageTitel";
    s[idKey]=el.value;delete s[snapKey];delete s[titelKey]; // neu einfrieren beim Rendern
    if(slot===1)s.vorlageManuell=true; // selbst gewählt → Titel überschreibt nicht mehr
    save();renderDetail();}));
  // Fragebogen-Antworten
  document.querySelectorAll('[data-qa]').forEach(el=>el.addEventListener("change",()=>{const s=k.sessions.find(x=>x.id===el.dataset.s);if(!s)return;
    const slot=+el.dataset.qa;const snapKey=slot===2?"fragen2":"fragen";const answerKey=slot===2?"antworten2":"antworten";
    const frage=(s[snapKey]||[])[+el.dataset.qi];if(frage===undefined)return;
    s[answerKey]=s[answerKey]||{};s[answerKey][frage]=el.value.trim();save();}));
  // Nachfrage-Feld → ins Nachchecken
  document.querySelectorAll('[data-nachfrage]').forEach(el=>el.addEventListener("change",()=>{const s=k.sessions.find(x=>x.id===el.dataset.s);if(!s)return;
    const neu=el.value.trim();const alt=s.nachfrage||"";s.nachfrage=neu;
    if(neu&&neu!==alt){k.nachchecken=k.nachchecken||[];if(!k.nachchecken.some(n=>n.text===neu))k.nachchecken.push({id:uid("nc"),text:neu,done:false,auto:true});}
    save();renderDetail();}));

/* Nachchecken aus Ziele/Aussagen automatisch übernehmen (nur ergänzen, nie eigenes löschen) */
function syncNachchecken(k,s){k.nachchecken=k.nachchecken||[];

  zeilen.forEach(z=>{const schonDa=k.nachchecken.some(n=>n.text===z)||(s._zielUebernommen||[]).includes(z);
    if(!schonDa){k.nachchecken.push({id:uid("nc"),text:z,done:false,auto:true});}});

function toggleSession(id){const k=K();const s=k.sessions.find(x=>x.id===id);s._open=!s._open;renderDetail();}

function wordDoc(title,innerHtml){ // ohne Brand (Rückfallebene, z. B. Tests)
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${escapeHtml(title)}</title>

  <body>${innerHtml}</body></html>`;}
function saveWord(filename,html){const blob=new Blob(['\ufeff',html],{type:"application/msword"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();}
async function downloadAkteWord(set,withFotos){const k=K();let fotoHtml="";
  if(withFotos){for(const f of (k.fotos||[])){const rec=await txGet("files",f.fid);if(!rec)continue;
    try{const blob=await decBlob(rec);const dataUrl=await blobToDataUrl(blob);const m=MILESTONES.find(x=>x.key===f.key);
      fotoHtml+=`<div style="display:inline-block;text-align:center"><img src="${dataUrl}"><div style="font-size:12px;color:#666">${m?m.label:""}</div></div>`;}catch(e){}}}
  const inner=mdToHtml(clientMarkdown(k,set))+(fotoHtml?`<h2>Fotos</h2>${fotoHtml}`:"");
  saveWord(`Akte_${safe(k.name)}.doc`,await wordDocBrand(k.name||"Akte",inner));
  toast("Word-Dokument heruntergeladen — du kannst es frei bearbeiten.");}
function blobToDataUrl(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});}
function mdToHtml(md){return md.split("\n").map(l=>{
  if(l.startsWith("## "))return `<h2>${escapeHtml(l.slice(3))}</h2>`;
  if(l.startsWith("# "))return `<h1>${escapeHtml(l.slice(2))}</h1>`;
  if(l.startsWith("- "))return `<p>• ${inlineBold(l.slice(2))}</p>`;
  if(!l.trim())return "";return `<p>${inlineBold(l)}</p>`;}).join("");}
function inlineBold(s){return escapeHtml(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}

const SPRACH_NAME={de:"Deutsch",en:"Englisch",it:"Italienisch"};
function verbesserPrompt(lang,inhalt){
  const ziel=SPRACH_NAME[lang]||"Deutsch";
  const p=STATE.settings.praxis;
  return `Bitte verbessere den folgenden Text für mein Kundendokument${p.name?" ("+p.name+")":""}.

So soll er klingen: ruhig, geerdet, einfache Sprache, Fokus auf Körperwahrnehmung. Muster statt Trauma. Erfahrung vor Theorie. Warm, aber nicht kitschig. Du sprichst die Klientin/den Klienten mit "du" an.

Gib den Text vollständig auf ${ziel} aus, in derselben Abschnittsstruktur. Wenn dir etwas unklar ist oder du nicht weißt, was ich mit einer Formulierung meine, frag mich zuerst, bevor du schreibst.

--- MEIN ROHTEXT ---
${inhalt}
--- ENDE ---`;}
async function copyVerbesserung(lang){const inhalt=kundendocRoh();

  catch(e){toast("Kopieren nicht möglich.");}}

/* ===== Statistik ===== */
function statistikDaten(jahre){ // jahre = null (alles) oder Array von Jahres-Strings
  const ks=STATE.klienten;
  const inScope=s=>!jahre||(s.datum&&jahre.includes(s.datum.slice(0,4)));
  const allSessions=[];ks.forEach(k=>(k.sessions||[]).forEach(s=>{if(inScope(s))allSessions.push({k,s});}));
  const echt=allSessions.filter(x=>!x.s.zwischen);
  const zwischen=allSessions.length-echt.length;
  // Sitzungen pro Monat (Jahresverlauf)
  const perMonth={};allSessions.forEach(({s})=>{if(s.datum){const m=s.datum.slice(0,7);perMonth[m]=(perMonth[m]||0)+1;}});
  // neue Klient:innen pro Jahr = erstes Sitzungsdatum
  const firstYear={};ks.forEach(k=>{const ds=(k.sessions||[]).map(s=>s.datum).filter(Boolean).sort();
    if(ds.length){const y=ds[0].slice(0,4);if(!jahre||jahre.includes(y))firstYear[y]=(firstYear[y]||0)+1;}});
  // Status-Verteilung
  const status={aktiv:0,pausiert:0,nachfragen:0,beendet:0};ks.forEach(k=>{status[k.status]=(status[k.status]||0)+1;});
  // Retention: abgeschlossene vs abgebrochene Serien
  let serienAbgeschlossen=0,serienAbgebrochen=0;
  ks.forEach(k=>{(k.archiv||[]).forEach(a=>{const n=(a.sessions||[]).filter(s=>!s.zwischen).length;const tot=SERIEN[(a.serie&&a.serie.typ)||"offen"]||0;
    if(tot&&n>=tot)serienAbgeschlossen++;else serienAbgebrochen++;});});
  const abschlussQuote=(serienAbgeschlossen+serienAbgebrochen)?Math.round(serienAbgeschlossen/(serienAbgeschlossen+serienAbgebrochen)*100):null;
  // Wiederkehrer: mehr als eine Serie insgesamt (aktuelle + archivierte)
  const wiederkehrer=ks.filter(k=>((k.archiv||[]).length + (sessionCount(k)>0?1:0))>=2).length;
  // Abbruchpunkt: bei welcher Sitzungsnummer enden abgebrochene Serien
  const abbruch={};ks.forEach(k=>{(k.archiv||[]).forEach(a=>{const n=(a.sessions||[]).filter(s=>!s.zwischen).length;const tot=SERIEN[(a.serie&&a.serie.typ)||"offen"]||0;
    if(!(tot&&n>=tot)&&n>0)abbruch[n]=(abbruch[n]||0)+1;});});
  // Sitzungsabstand (Tage) im Schnitt
  let abst=[];ks.forEach(k=>{const ds=(k.sessions||[]).filter(s=>!s.zwischen&&s.datum).map(s=>s.datum).sort();
    for(let i=1;i<ds.length;i++){const d=(new Date(ds[i])-new Date(ds[i-1]))/86400000;if(d>0&&d<400)abst.push(d);}});
  const schnittAbstand=abst.length?Math.round(abst.reduce((a,b)=>a+b,0)/abst.length):null;
  // Seriendauer (Wochen) abgeschlossener Serien
  let dauer=[];ks.forEach(k=>{(k.archiv||[]).forEach(a=>{const ds=(a.sessions||[]).map(s=>s.datum).filter(Boolean).sort();
    if(ds.length>=2){const w=(new Date(ds[ds.length-1])-new Date(ds[0]))/(86400000*7);if(w>0)dauer.push(w);}});});
  const schnittDauer=dauer.length?Math.round(dauer.reduce((a,b)=>a+b,0)/dauer.length):null;
  // laufende Serien mit Fortschritt
  const laufend=ks.filter(k=>k.status==="aktiv"&&k.serie).map(k=>({name:k.name,cnt:sessionCount(k),tot:serieTotal(k)}));
  // letzte 30 Tage
  const grenze=Date.now()-30*86400000;
  const letzte30=allSessions.filter(({s})=>s.datum&&new Date(s.datum).getTime()>=grenze).length;
  // Terminbindung
  const aktive=ks.filter(k=>k.status==="aktiv");
  const mitTermin=aktive.filter(k=>k.naechsterTermin).length;
  const terminbindung=aktive.length?Math.round(mitTermin/aktive.length*100):null;
  // offene Erinnerungen
  const offeneErinnerungen=overduePersons().length+fotoPersons().length;
  // Serientyp-Verteilung
  const serientyp={};ks.forEach(k=>{if(k.serie){const t=SERIE_LABEL[k.serie.typ]||k.serie.typ;serientyp[t]=(serientyp[t]||0)+1;}});
  // Honorar-Umsatz
  const umsatz=berechneUmsatz(allSessions);
  return {ks,anzahl:ks.length,echt:echt.length,zwischen,perMonth,firstYear,status,serienAbgeschlossen,serienAbgebrochen,
    abschlussQuote,wiederkehrer,abbruch,schnittAbstand,schnittDauer,laufend,letzte30,terminbindung,offeneErinnerungen,serientyp,umsatz};}
function honorarFor(k,s){const H=STATE.settings.honorare||[];
  const typ=s.zwischen?"zwischen":((k.serie&&k.serie.typ)||"offen");
  const h=H.find(x=>x.typ===typ);return h?(+h.betrag||0):0;}
function berechneUmsatz(allSessions){const proMonat={},proJahr={};let gesamt=0;
  allSessions.forEach(({k,s})=>{const b=honorarFor(k,s);if(!b||!s.datum)return;gesamt+=b;
    const m=s.datum.slice(0,7),y=s.datum.slice(0,4);proMonat[m]=(proMonat[m]||0)+b;proJahr[y]=(proJahr[y]||0)+b;});
  return {gesamt,proMonat,proJahr};}
let statJahre=null;
function renderStatistik(){
  const alleJahre=[...new Set(STATE.klienten.flatMap(k=>(k.sessions||[]).map(s=>s.datum&&s.datum.slice(0,4)).filter(Boolean)))].sort();
  const d=statistikDaten(statJahre);
  const bar=(obj,fmtV)=>{const keys=Object.keys(obj).sort();if(!keys.length)return '<p style="color:var(--ink-soft)">Noch keine Daten.</p>';

  const eur=n=>n.toLocaleString("de-DE")+" €";
  $("#view").innerHTML=`<button class="back" onclick="go('overview')">‹ Zurück</button>

    <div class="controls" style="margin:10px 0"><div class="seg" style="flex-wrap:wrap">
      <button class="${statJahre===null?'on':''}" onclick="setStatJahr(null)">Alle Jahre</button>

    </div></div>

function statistikInhalt(d,bar,eur){return `
    <div class="statgrid">
      <div class="stat"><div class="num">${d.anzahl}</div><div class="cap">Klient:innen</div></div>
      <div class="stat"><div class="num">${d.status.aktiv||0}</div><div class="cap">aktiv</div></div>

      <div class="stat"><div class="num">${d.schnittAbstand===null?"—":d.schnittAbstand+" T"}</div><div class="cap">Ø Sitzungsabstand</div></div>
      <div class="stat"><div class="num">${d.schnittDauer===null?"—":d.schnittDauer+" W"}</div><div class="cap">Ø Seriendauer</div></div>
      <div class="stat"><div class="num">${d.terminbindung===null?"—":d.terminbindung+"%"}</div><div class="cap">mit nächstem Termin</div></div>
      <div class="stat"><div class="num">${d.zwischen}</div><div class="cap">Zwischensitzungen</div></div>
      <div class="stat"><div class="num">${d.offeneErinnerungen}</div><div class="cap">offene Erinnerungen</div></div>
      <div class="stat"><div class="num">${d.umsatz.gesamt?eur(d.umsatz.gesamt):"—"}</div><div class="cap">Umsatz (Zeitraum)</div></div>
    </div>

    <div class="panel"><div class="phead"><h3>Honorare</h3></div><div class="pbody">
      <p class="hint">Trag hier deine Sätze ein — sie fließen sofort in die Umsatzzahlen. Frei änderbar.</p>
      <div id="honorarRows">${honorarRows(eur)}</div>
    </div></div>

    <div class="panel"><div class="phead"><h3>Sitzungen pro Monat</h3></div><div class="pbody">${bar(d.perMonth)}</div></div>
    ${Object.keys(d.umsatz.proMonat).length?`<div class="panel"><div class="phead"><h3>Umsatz pro Monat</h3></div><div class="pbody">${bar(d.umsatz.proMonat,eur)}</div></div>`:""}
    <div class="panel"><div class="phead"><h3>Neue Klient:innen pro Jahr</h3></div><div class="pbody">${bar(d.firstYear)}</div></div>
    <div class="panel"><div class="phead"><h3>Abbruchpunkt (bei welcher Sitzung Serien enden)</h3></div><div class="pbody">
      <p class="hint">Zeigt, wo Menschen am häufigsten aussteigen — nur abgebrochene Serien.</p>
      ${Object.keys(d.abbruch).length?bar(Object.fromEntries(Object.entries(d.abbruch).map(([n,c])=>["Sitzung "+n,c]))):'<p style="color:var(--ink-soft)">Keine abgebrochenen Serien — schön.</p>'}
    </div></div>
    <div class="panel"><div class="phead"><h3>Serien</h3></div><div class="pbody">
      <p>Abgeschlossen: <b>${d.serienAbgeschlossen}</b> · abgebrochen: <b>${d.serienAbgebrochen}</b></p>
      ${d.laufend.length?`<p style="margin-top:10px;font-size:13.5px;color:var(--ink-soft)">Laufend:</p>${d.laufend.map(l=>`<div class="thread"><div class="tn">${escapeHtml(l.name||"—")}</div><div class="tb"><i style="width:${l.tot?Math.round(l.cnt/l.tot*100):0}%"></i></div><div class="tc">${l.cnt}${l.tot?" / "+l.tot:""}</div></div>`).join("")}`:""}
    </div></div>
    <div class="panel"><div class="phead"><h3>Serientypen</h3></div><div class="pbody">${bar(d.serientyp)}</div></div>

function honorarRows(eur){const typen=[["10er","10er-Serie"],["offen","Einzelsitzung / offen"],["zwischen","Zwischensitzung"]];

      <button class="btn-danger btn-sm" onclick="delSuchgruppe('${g.id}')">✕</button></div>`).join("")}</div>
    <button class="btn-ghost btn-sm" onclick="addSuchgruppe()" style="margin-top:10px">Gruppe hinzufügen</button>`;}
function blkVorlagen(){return `<p class="hint">Beim Eintippen eines Sitzungstitels erscheint automatisch die passende Vorlage.</p>
    <div>${STATE.vorlagen.map(vorlageRow).join("")}</div>
    <button class="btn-ghost btn-sm" onclick="addVorlage()" style="margin-top:10px">Neue Vorlage</button>`;}
function blkBackup(){const has=!!backupDir;
  return `<div class="setrow"><div class="txt"><b>Automatische Sicherung</b>
      <p>Bei jeder Änderung und beim Verlassen: pro Person einzelne Dokumente (Stammdaten, Health Form, Bodyreading, je Sitzung, Momente, Nachchecken, Gesamtakte) als Markdown <b>und</b> Word, dazu Fotos und Health-Form-Dateien. Bewusst im Klartext — dein Rettungsanker. Leg den Ordner an einen sicheren, privaten Ort.</p></div>
      <span class="status ${has?'ok':''}">${has?'verbunden':'nicht gesetzt'}</span></div>
    <div class="row"><button class="btn-primary btn-sm" onclick="chooseBackup()">${has?'Anderen Ordner wählen':'Sicherungsordner wählen'}</button>
      ${has?`<button class="btn-ghost btn-sm" onclick="sichereJetzt()">Jetzt alles sichern</button>`:''}</div>
    ${window.showDirectoryPicker?'':'<p style="color:var(--rot);font-size:13.5px;margin-top:10px">Für die automatische Sicherung bitte Chrome oder Edge verwenden.</p>'}`;}
function blkDaten(){const pwOn=STATE.settings.passwortAktiv;
  return `<div class="setrow"><div class="txt"><b>Beim Öffnen Passwort verlangen</b>
      <p>Aus = ohne Eingabe direkt rein. An = alle Daten inkl. Fotos verschlüsselt.</p></div>
      <label class="switch"><input type="checkbox" id="pwToggle" ${pwOn?"checked":""}><span class="slider"></span></label></div>
    ${pwOn?`<div class="row" style="margin-top:10px"><button class="btn-ghost btn-sm" onclick="showChangePw()">Passwort ändern</button>
      <button class="btn-ghost btn-sm" onclick="showRecoveryAgain()">Neuen Wiederherstellungs-Code erzeugen</button></div><div id="pwChange"></div>`:""}
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px">
      <div class="row"><button class="btn-ghost btn-sm" onclick="exportKomplett()">Komplettsicherung (mit Fotos)</button>
        <button class="btn-ghost btn-sm" onclick="exportJson()">Nur Texte (JSON)</button>
        <button class="btn-ghost btn-sm" onclick="document.getElementById('imp').click()">Wiederherstellen</button>
        <input id="imp" type="file" accept="application/json,.pcbackup,.zip" class="hidden" onchange="importJson(event)"></div>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:12px">${STATE.klienten.length} Klient:innen · ${STATE.klienten.reduce((n,k)=>n+sessionCount(k),0)} Sitzungen.</p>
    </div>`;}
function bindSuchgruppen(){document.querySelectorAll('[data-sg]').forEach(el=>el.addEventListener("change",()=>{
  const g=STATE.settings.suchgruppen.find(x=>x.id===el.dataset.sg);if(!g)return;
  g.woerter=el.value.split(",").map(w=>w.trim()).filter(Boolean);save();}));}
function addSuchgruppe(){STATE.settings.suchgruppen.push({id:uid("sg"),woerter:[]});save();renderSettings();}
function delSuchgruppe(id){if(!confirm("Gruppe löschen?"))return;STATE.settings.suchgruppen=STATE.settings.suchgruppen.filter(g=>g.id!==id);save();renderSettings();}
function P(){return STATE.settings.praxis;}
function savePraxis(){const g=id=>{const el=$("#"+id);return el?el.value.trim():"";};
  const p=P();p.name=g("px_name");p.inhaberin=g("px_inh");p.adresse=g("px_adr");p.telefon=g("px_tel");
  p.email=g("px_mail");p.web=g("px_web");p.fuss=$("#px_fuss").value;p.farbe=g("px_farbe");
  save();toast("Praxisdaten gespeichert.");}
async function uploadLogo(){const f=$("#px_logo").files[0];if(!f){toast("Bitte zuerst eine Datei wählen.");return;}
  const fid=await storeFile(f);P().logoFid=fid;logoDataUrl=null;save();renderSettings();toast("Logo gespeichert.");}
function delLogo(){if(!confirm("Logo entfernen?"))return;P().logoFid="";logoDataUrl=null;save();renderSettings();}
function bindBausteine(){document.querySelectorAll('[data-bs]').forEach(el=>el.addEventListener("change",()=>{
  const b=STATE.settings.bausteine.find(x=>x.id===el.dataset.bs);if(!b)return;
  b[el.dataset.bsk]=el.dataset.bsk==="titel"?(el.value.trim()||b.titel):el.value;save();}));}
function addBaustein(){STATE.settings.bausteine.push({id:uid("b"),titel:"Neuer Baustein",text:""});save();renderSettings();}
function delBaustein(id){if(!confirm("Baustein löschen?"))return;STATE.settings.bausteine=STATE.settings.bausteine.filter(b=>b.id!==id);save();renderSettings();}
function bindPrompts(){document.querySelectorAll('[data-pr]').forEach(el=>el.addEventListener("change",()=>{
  const p=STATE.settings.prompts.find(x=>x.id===el.dataset.pr);if(!p)return;
  p[el.dataset.prk]=el.dataset.prk==="titel"?(el.value.trim()||p.titel):el.value;save();}));}
function addPrompt(){STATE.settings.prompts.push({id:uid("p"),titel:"Neue Vorlage",text:"{akte}"});save();renderSettings();}
function delPrompt(id){if(!confirm("Vorlage löschen?"))return;STATE.settings.prompts=STATE.settings.prompts.filter(p=>p.id!==id);save();renderSettings();}
function vorlageRow(v){return `<div class="sess" style="margin-top:10px"><div class="sessbody" style="border:none">
  <div class="grid2">
    <div class="field"><label>Titel der Vorlage${v.standard?" (Standard)":""}</label><input data-v="${v.id}" data-vk="titel" value="${escapeAttr(v.titel)}"></div>
    <div class="field"><label>Gilt für Sitzung Nr.</label><input type="number" min="1" max="30" data-v="${v.id}" data-vk="nr" value="${v.nr||""}" placeholder="—">
      <p class="hint" style="margin:6px 0 0">Tippst du <b>#${v.nr||"N"}</b> in den Sitzungstitel, kommt diese Vorlage automatisch.</p></div>
  </div>
  <div class="field"><label>Fragen (eine pro Zeile)</label><textarea data-v="${v.id}" data-vk="fragen" style="min-height:100px">${escapeHtml((Array.isArray(v.fragen)?v.fragen:[]).join("\n"))}</textarea></div>
  ${v.standard?'':`<button class="btn-danger btn-sm" onclick="delVorlage('${v.id}')">Vorlage löschen</button>`}</div></div>`;}
function bindVorlagen(){document.querySelectorAll('[data-v]').forEach(el=>el.addEventListener("change",()=>{const v=STATE.vorlagen.find(x=>x.id===el.dataset.v);if(!v)return;
  if(el.dataset.vk==="titel")v.titel=el.value.trim()||v.titel;
  else if(el.dataset.vk==="nr"){const n=parseInt(el.value);
    if(n>0){STATE.vorlagen.forEach(o=>{if(o.id!==v.id&&o.nr===n)o.nr=null;});v.nr=n;} // Nummer ist eindeutig
    else v.nr=null;save();renderSettings();return;}
  else v.fragen=el.value.split("\n").map(x=>x.trim()).filter(Boolean);
  save();}));}
function addVorlage(){STATE.vorlagen.push({id:uid("v"),titel:"Neue Vorlage",standard:false,fragen:["Frage 1"]});save();renderSettings();}
function delVorlage(id){if(!confirm("Vorlage löschen?"))return;STATE.vorlagen=STATE.vorlagen.filter(v=>v.id!==id);save();renderSettings();}
function saveThresh(){const g=parseInt($("#s_gelb").value)||22,r=parseInt($("#s_rot").value)||43;STATE.settings.schwellen={gelb:g,rot:Math.max(r,g+1)};save();toast("Ampel aktualisiert.");renderSettings();}
async function togglePw(on){const cfg=await txGet("kv","config");
  if(on){const p=prompt("Neues Passwort festlegen (mind. 4 Zeichen):");if(!p||p.length<4){toast("Abgebrochen.");renderSettings();return;}
    const s=crypto.getRandomValues(new Uint8Array(16));cfg.pwSalt=b64(s);cfg.wrapPw=await wrapMK(MK,await pbkdf2Key(p,s));cfg.passwortAktiv=true;delete cfg.mkPlain;
    await txSet("kv","config",cfg);STATE.settings.passwortAktiv=true;await save();toast("Passwortschutz aktiviert.");renderSettings();}
  else{if(!confirm("Passwortschutz wirklich ausschalten? Die Daten liegen dann unverschlüsselt auf diesem Gerät.")){renderSettings();return;}
    cfg.passwortAktiv=false;cfg.mkPlain=await rawMK();delete cfg.wrapPw;delete cfg.pwSalt;
    await txSet("kv","config",cfg);STATE.settings.passwortAktiv=false;await save();toast("Passwortschutz aus.");renderSettings();}}
function showChangePw(){$("#pwChange").innerHTML=`<div class="grid2" style="margin-top:12px">
  <div class="field"><label>Neues Passwort</label><input type="password" id="np1"></div>
  <div class="field"><label>Wiederholen</label><input type="password" id="np2"></div></div><button class="btn-ghost btn-sm" onclick="changePw()">Speichern</button>`;}
async function changePw(){const p1=$("#np1").value,p2=$("#np2").value;if(p1.length<4){toast("Mind. 4 Zeichen.");return;}if(p1!==p2){toast("Stimmt nicht überein.");return;}
  const cfg=await txGet("kv","config");const s=crypto.getRandomValues(new Uint8Array(16));cfg.pwSalt=b64(s);cfg.wrapPw=await wrapMK(MK,await pbkdf2Key(p1,s));
  await txSet("kv","config",cfg);toast("Passwort geändert.");renderSettings();}
async function showRecoveryAgain(){const code=genRecovery();const cfg=await txGet("kv","config");const s=crypto.getRandomValues(new Uint8Array(16));
  cfg.recSalt=b64(s);cfg.wrapRec=await wrapMK(MK,await pbkdf2Key(code,s));await txSet("kv","config",cfg);
  $("#lock").classList.remove("hidden");$("#app").classList.add("hidden");
  showRecovery(code,()=>{$("#lock").classList.add("hidden");$("#app").classList.remove("hidden");renderSettings();});}
function exportJson(){const clean=structuredClone(STATE);clean.klienten.forEach(k=>(k.sessions||[]).forEach(s=>delete s._open));
  delete clean.__files;
  const blob=new Blob([JSON.stringify(clean,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="praxis-cockpit-texte.json";a.click();
  toast("Textsicherung gespeichert (ohne Fotos).");}
/* Sammelt alle referenzierten Datei-IDs (Fotos, Health-Form-Dateien, Logo, Willkommensdatei) */
function alleFileIds(){const ids=new Set();
  STATE.klienten.forEach(k=>{(k.fotos||[]).forEach(f=>f.fid&&ids.add(f.fid));
    (k.healthFiles||[]).forEach(f=>f.fid&&ids.add(f.fid));});
  if(STATE.settings.praxis&&STATE.settings.praxis.logoFid)ids.add(STATE.settings.praxis.logoFid);
  if(STATE.settings.willkommen&&STATE.settings.willkommen.fid)ids.add(STATE.settings.willkommen.fid);
  return [...ids];}
async function exportKomplett(){toast("Sammle Fotos und Dateien …");
  try{
    const clean=structuredClone(STATE);clean.klienten.forEach(k=>(k.sessions||[]).forEach(s=>delete s._open));
    const ids=alleFileIds();const files={};
    for(const fid of ids){try{const blob=await getFileBlob(fid);if(blob){
      const dataUrl=await blobToDataUrl(blob);files[fid]={type:blob.type||"application/octet-stream",data:dataUrl};}}catch(e){}}
    clean.__files=files;clean.__komplett=true;
    const blob=new Blob([JSON.stringify(clean)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="praxis-cockpit-komplett-"+today()+".pcbackup";a.click();
    toast(`Komplettsicherung gespeichert (${STATE.klienten.length} Klient:innen, ${ids.length} Dateien).`);
  }catch(e){console.error("exportKomplett",e);toast("Sicherung fehlgeschlagen: "+(e&&e.message||e));}}
function importJson(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.klienten)throw 0;
    const files=d.__files;delete d.__files;delete d.__komplett;
    STATE=Object.assign(DEFAULTS(),d);
    if(!STATE.vorlagen.length)STATE.vorlagen=defaultVorlagen();migrateSettings();STATE.klienten.forEach(migrate);
    // Dateien wiederherstellen (verschlüsselt in IndexedDB ablegen unter derselben fid)
    if(files){let n=0;for(const fid of Object.keys(files)){try{const blob=await dataUrlToBlob(files[fid].data,files[fid].type);
      await txSet("files",fid,await encBlob(blob));n++;}catch(e){}}
      urlCache={};logoDataUrl=null;await save();toast(`Wiederhergestellt inkl. ${n} Dateien.`);}
    else{await save();toast("Texte wiederhergestellt (keine Fotos in dieser Datei).");}
    go("overview");}catch(e){toast("Datei nicht lesbar.");}};
  r.readAsText(f);}
function dataUrlToBlob(dataUrl,type){return fetch(dataUrl).then(r=>r.blob());}

/* ===== Utils ===== */
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
let toastTimer=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);}

/* App installierbar + offline: Service Worker registrieren (nur unter http/https, nicht bei file://) */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e));});}
boot();
</script>
</body>
</html>
